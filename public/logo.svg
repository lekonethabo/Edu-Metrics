<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <!-- Main rounded background -->
  <rect x="20" y="20" width="200" height="200" rx="48" fill="url(#grad)" />
  
  <!-- Graduation Cap -->
  <path d="M 120 70 L 190 100 L 120 130 L 50 100 Z" fill="url(#sparkle)" />
  <path d="M 85 115 L 85 145 C 85 165, 155 165, 155 145 L 155 115" fill="none" stroke="url(#sparkle)" stroke-width="8" stroke-linecap="round" />
  <path d="M 190 100 L 190 145 C 190 150, 185 155, 180 155" fill="none" stroke="url(#sparkle)" stroke-width="4" stroke-linecap="round" />
  <circle cx="180" cy="155" r="5" fill="#ffffff" />
  
  <!-- Rising Metric Chart Line Overlay -->
  <path d="M 60 180 L 100 150 L 140 160 L 180 120" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="180" cy="120" r="8" fill="#10b981" />
</svg>
